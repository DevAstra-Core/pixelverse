<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="movie.css">
</head>
<body>
    <main>
        <div class="movie-top-bar">
            <div class="movie-top-bar-container">
                <button id="back-to-home" >
                    <svg viewBox="0 0 512 512" id="back-icon"  xmlns="http://www.w3.org/2000/svg" fill="#000000"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <defs> <style>.cls-1{fill:none;stroke:#ffffff;stroke-linecap:round;stroke-linejoin:round;stroke-width:20px;}</style> </defs> <g data-name="Layer 2" id="Layer_2"> <g data-name="E416, back, Media, media player, multimedia, player" id="E416_back_Media_media_player_multimedia_player"> <circle class="cls-1" cx="256" cy="256" r="246"></circle> <polyline class="cls-1" points="333.82 100.37 178.18 256 333.82 411.63"></polyline> </g> </g> </g></svg>

                </button>
                <p>PIXEL VERSE</p>
            </div>
        </div>


        <div class="section" id="container-movie">
            <div class="movie-wrapper-box">

                <div class="movie-box-container">

                    <div class="movie-poster-box" id="movie-poster-box">
                        <img src="assets/inception.jpg" id="movie-poster" style="height: 35vh; border-radius: 10px;" alt="">
                    </div>

                    <div class="movie-loading-box" id="movie-loading-box" style="display: none;">
                                <div id="trailer-loading-state">
                                    <div class="spinner"></div>
                                    <p>Loading...</p>
                                </div>
                                <div id="trailer-error-state" style="display: none;">
                                    <p>Due to a server issue, video is unavailable right now.</p>
                                </div>
                    </div>

                </div>

                <div class="movie-title-keyword">
                    <p id="movie-title" style="font-size: 25px;font-family: sans-serif; pointer-events: none;">Loading...</p>

                    <div class="keyword-box" id="keyword-box">
                        
                    </div>
                </div>
                <div class="movie-control-box">
                    <button id="play-movie">Play</button>

                    <button class="control-btns" id="wishlist-box" title="Add to wishlist">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 16.0909V11.0975C21 6.80891 21 4.6646 19.682 3.3323C18.364 2 16.2426 2 12 2C7.75736 2 5.63604 2 4.31802 3.3323C3 4.6646 3 6.80891 3 11.0975V16.0909C3 19.1875 3 20.7358 3.73411 21.4123C4.08421 21.735 4.52615 21.9377 4.99692 21.9915C5.98402 22.1045 7.13673 21.0849 9.44216 19.0458C10.4612 18.1445 10.9708 17.6938 11.5603 17.5751C11.8506 17.5166 12.1494 17.5166 12.4397 17.5751C13.0292 17.6938 13.5388 18.1445 14.5578 19.0458C16.8633 21.0849 18.016 22.1045 19.0031 21.9915C19.4739 21.9377 19.9158 21.735 20.2659 21.4123C21 20.7358 21 19.1875 21 16.0909Z" stroke="currentColor" stroke-width="1.5"></path>
                            <path opacity="0.5" d="M15 6H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
                        </svg>
                    </button>

                    <button class="control-btns" id="like-box" title="Like">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15.7 4C18.87 4 21 6.98 21 9.76C21 15.39 12.16 20 12 20C11.84 20 3 15.39 3 9.76C3 6.98 5.13 4 8.3 4C10.12 4 11.31 4.91 12 5.71C12.69 4.91 13.88 4 15.7 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                    <p id="action-toast" class="action-toast"></p>
                </div>



                <div class="movie-details-box">
                    <p style="font-size: 18px;">Release in <span id="release-date"></span></p>
                    <p id="movie-details" >
                    loading...    
                    </p>
                    
                </div>

                <div class="director-box" style="font-size: 16px;font-weight: 700;margin-bottom: 10px;">
                    <p>Directed by <span id="director-name">Loading...</span></p>
                </div>

            </div>
            <div class="suggested-movie-box">
                <div class="similar-type-movies-box">
                    <p style="font-size: 18px;">Similar movies</p>
                    <div class="similar-movies-wrapper">
        
                        
             
                    </div>
                </div>
                <div class="suggestion-movies-box">
                    <p style="font-size: 18px;">Suggestions</p>

                    <div class="suggestion-movies-wrapper">
        
                       
             
                    </div>


                </div>
            </div>
        </div>
    </main>
    <script type="module" src="movie.js"></script>
</body>
</html>
